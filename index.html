<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KorEdu 로그인 샘플 (Supabase)</title>
<style>
  :root{--bg:#f6f8fb;--surface:#fff;--line:#e7ebf1;--text:#172033;--muted:#6d7688;--accent:#3157d5}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:28px;box-shadow:0 20px 50px rgba(20,30,60,.08)}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}
  label{display:block;font-size:12px;font-weight:700;color:#4d5869;margin:14px 0 6px}
  input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;outline:none}
  input:focus{border-color:#8ca3ee;box-shadow:0 0 0 3px rgba(49,87,213,.1)}
  .row{display:flex;gap:8px;margin-top:18px}
  button{flex:1;height:42px;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#2a4bc2}
  .btn-secondary{background:#eef1f7;color:#374151}
  .btn-secondary:hover{background:#e3e8f2}
  .msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;display:none}
  .msg.show{display:block}
  .msg.info{background:#eef2ff;color:#3450a5;border:1px solid #dde5ff}
  .msg.error{background:#fff5f5;color:#a63b3b;border:1px solid #ffdada}
  .msg.ok{background:#f2fbf6;color:#28704a;border:1px solid #d4f1df}
  .session{display:none;text-align:center}
  .session.show{display:block}
  .session .avatar{width:52px;height:52px;border-radius:16px;background:#172033;color:#fff;
    display:grid;place-items:center;font-size:20px;font-weight:800;margin:0 auto 12px}
  .session .email{font-size:14px;font-weight:700;word-break:break-all}
  .form{display:none}
  .form.show{display:block}
  .setup-warn{background:#fff8ef;border:1px solid #f3d0a8;color:#8a5a12;border-radius:10px;
    padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:18px}
  .setup-warn code{background:#fff;border-radius:4px;padding:1px 4px}
</style>
</head>
<body>
  <div class="card">
    <h1>KorEdu 로그인 샘플</h1>
    <p class="sub">GitHub + Vercel + Supabase 배포 파이프라인 테스트용 미니 샘플입니다. 실제 KorEdu 앱과는 별개예요.</p>

    <div id="setupWarn" class="setup-warn" hidden>
      아직 Supabase 연결 정보가 안 채워져 있어요. 이 파일 맨 아래 <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> 값을 채워주세요.
    </div>

    <div id="msg" class="msg"></div>

    <div id="sessionBox" class="session">
      <div class="avatar" id="avatarInitial">U</div>
      <div class="email" id="sessionEmail"></div>
      <div class="row"><button class="btn-secondary" id="logoutBtn" style="flex:1 1 100%">로그아웃</button></div>
    </div>

    <form id="authForm" class="form show">
      <label>이메일</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required />
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="8자 이상" autocomplete="current-password" required />
      <div class="row">
        <button type="submit" class="btn-primary" id="loginBtn">로그인</button>
        <button type="button" class="btn-secondary" id="signupBtn">회원가입</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ── 여기 두 값만 채우면 바로 동작합니다 (Supabase 프로젝트 설정 > API 에서 확인) ──
    const SUPABASE_URL = 'https://mgapkkmvistfpzkmskny.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tmepscu3AhhxeDpIBduPJg_q5ciucAb';
    // ────────────────────────────────────────────────────────────────

    const notConfigured = SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_');
    document.getElementById('setupWarn').hidden = !notConfigured;

    const supabase = notConfigured ? null : createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msgEl = document.getElementById('msg');
    const formEl = document.getElementById('authForm');
    const sessionBox = document.getElementById('sessionBox');
    const sessionEmail = document.getElementById('sessionEmail');
    const avatarInitial = document.getElementById('avatarInitial');

    function showMsg(text, type = 'info') {
      msgEl.textContent = text;
      msgEl.className = `msg show ${type}`;
    }
    function clearMsg() {
      msgEl.className = 'msg';
    }

    function renderSession(user) {
      if (user) {
        formEl.classList.remove('show');
        sessionBox.classList.add('show');
        sessionEmail.textContent = user.email;
        avatarInitial.textContent = (user.email || 'U')[0].toUpperCase();
      } else {
        formEl.classList.add('show');
        sessionBox.classList.remove('show');
      }
    }

    if (supabase) {
      supabase.auth.getSession().then(({ data }) => renderSession(data.session?.user || null));
      supabase.auth.onAuthStateChange((_event, session) => renderSession(session?.user || null));
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabase) return showMsg('먼저 SUPABASE_URL / SUPABASE_ANON_KEY를 채워주세요.', 'error');
      clearMsg();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showMsg(error.message, 'error');
      showMsg('로그인 성공!', 'ok');
    });

    document.getElementById('signupBtn').addEventListener('click', async () => {
      if (!supabase) return showMsg('먼저 SUPABASE_URL / SUPABASE_ANON_KEY를 채워주세요.', 'error');
      clearMsg();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || password.length < 8) return showMsg('이메일과 8자 이상 비밀번호를 입력하세요.', 'error');
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) return showMsg(error.message, 'error');
      showMsg('가입 완료! Supabase 기본 설정이면 인증 이메일이 발송됩니다 — 메일함을 확인하거나, Supabase 대시보드 Auth 설정에서 "Confirm email"을 꺼두면 바로 로그인할 수 있어요.', 'ok');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!supabase) return;
      await supabase.auth.signOut();
      showMsg('로그아웃했습니다.', 'info');
    });
  </script>
</body>
</html>
